<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>월간리뷰</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{--blue:#3182F6;--blue-bg:#E8F3FF;--red:#F04452;--red-bg:#FEECEE;--g900:#191F28;--g700:#333D4B;--g600:#4E5968;--g500:#6B7684;--g400:#8B95A1;--g200:#E5E8EB;--g100:#F2F4F6;--g50:#F9FAFB;--surface:#fff;--bg:#F2F4F6;color-scheme:light dark}
@media (prefers-color-scheme: dark){:root{--blue:#4593FC;--blue-bg:#1B2A44;--red:#F6606C;--red-bg:#3A1E24;--g900:#F2F4F6;--g700:#D5DAE0;--g600:#B0B8C1;--g500:#8B95A1;--g400:#6B7684;--g200:#333A44;--g100:#262B33;--g50:#1E2228;--surface:#17171C;--bg:#0F1013}}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--g900);font-family:'Pretendard','Apple SD Gothic Neo',-apple-system,BlinkMacSystemFont,sans-serif;-webkit-font-smoothing:antialiased;letter-spacing:-0.02em;display:flex;flex-direction:column}
.bar{flex:0 0 auto;background:var(--surface);border-bottom:1px solid var(--g200);padding:10px 16px;padding-top:calc(10px + env(safe-area-inset-top));display:flex;align-items:center;gap:10px;max-width:760px;width:100%;margin:0 auto}
.bar a,.bar button{font:inherit;font-size:13px;font-weight:700;color:var(--blue);background:var(--blue-bg);border:0;border-radius:10px;padding:8px 13px;text-decoration:none;cursor:pointer;white-space:nowrap}
.bar .t{flex:1;font-size:14px;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .lk{background:var(--g100);color:var(--g600)}
.wrap{flex:1;display:flex;flex-direction:column;max-width:760px;width:100%;margin:0 auto;background:var(--surface)}
iframe{flex:1;border:0;width:100%;min-height:0}
.lock{padding:56px 28px;text-align:center}
.lock .ic{font-size:44px;margin-bottom:14px}
.lock h1{font-size:22px;font-weight:800;letter-spacing:-0.03em;margin-bottom:8px}
.lock p{font-size:14.5px;color:var(--g500);line-height:1.6;margin-bottom:22px}
.lock form{display:flex;gap:8px;max-width:420px;margin:0 auto}
.lock input{flex:1;font:inherit;font-size:16px;padding:12px 14px;border:1.5px solid var(--g200);border-radius:12px;background:var(--g50);color:var(--g900);outline:none}
.lock input:focus{border-color:var(--blue)}
.lock button{font:inherit;font-size:14px;font-weight:800;background:var(--blue);color:#fff;border:0;border-radius:12px;padding:0 18px;cursor:pointer}
.lock .err{color:var(--red);font-size:13px;font-weight:700;margin-top:12px;min-height:18px}
.lock .hint{font-size:12.5px;color:var(--g400);margin-top:22px;line-height:1.6}
.spin{padding:80px;text-align:center;color:var(--g400);font-size:14px}
</style>
</head>
<body>
<div class="bar"><a href="index.html" id="back">← 마켓브리핑</a><div class="t" id="title">월간리뷰</div><button type="button" class="lk" id="lockbtn" title="이 기기에서 잠금">🔒</button></div>
<div class="wrap" id="wrap"><div class="spin" id="spin">불러오는 중…</div></div>
<script>
(function(){
  var KEYPFX = 'mb_mr_key:';
  var qs = new URLSearchParams(location.search);
  var id = (qs.get('id') || '').replace(/[^A-Za-z0-9_\-]/g, '');
  var wrap = document.getElementById('wrap');
  var KIND = { invest: '투자', asset: '가계·자산' };
  function titleOf(id){ var m = id.match(/^(\d{4})-(\d{2})_(\w+)$/); if (!m) return '월간리뷰'; return m[1] + '년 ' + String(parseInt(m[2], 10)) + '월 ' + (KIND[m[3]] || m[3]) + ' 월간리뷰'; }
  document.getElementById('title').textContent = titleOf(id);
  var b64 = { enc: function(u8){ var s=''; u8.forEach(function(b){ s += String.fromCharCode(b); }); return btoa(s); },
              dec: function(s){ var bin = atob(s), u8 = new Uint8Array(bin.length); for (var i=0;i<bin.length;i++) u8[i] = bin.charCodeAt(i); return u8; } };
  var enc = new TextEncoder(), dec = new TextDecoder();
  function saltKey(salt){ return KEYPFX + salt; }
  async function deriveKey(pass, saltB64, iter){
    var base = await crypto.subtle.importKey('raw', enc.encode(pass), 'PBKDF2', false, ['deriveKey']);
    return crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b64.dec(saltB64), iterations: iter, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, true, ['decrypt']);
  }
  async function loadKey(saltB64){ try { var raw = localStorage.getItem(saltKey(saltB64)); if (!raw) return null; return await crypto.subtle.importKey('raw', b64.dec(raw), { name: 'AES-GCM' }, true, ['decrypt']); } catch(e){ return null; } }
  async function saveKey(key, saltB64){ try { var raw = await crypto.subtle.exportKey('raw', key); localStorage.setItem(saltKey(saltB64), b64.enc(new Uint8Array(raw))); } catch(e){} }
  async function decryptWith(key, j){ var pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64.dec(j.iv) }, key, b64.dec(j.ct)); return dec.decode(pt); }
  function markRead(){ try { var k = 'monthly.html?id=' + id, r = new Set(JSON.parse(localStorage.getItem('mb_read') || '[]')); if (!r.has(k)) { r.add(k); localStorage.setItem('mb_read', JSON.stringify(Array.from(r))); } } catch(e){} }
  function show(html){
    wrap.innerHTML = '';
    var f = document.createElement('iframe');
    f.setAttribute('sandbox', 'allow-scripts allow-same-origin allow-top-navigation allow-popups');
    var withBase = html.replace(/<head>/i, '<head><base target="_top">');
    f.srcdoc = withBase;
    wrap.appendChild(f);
    markRead();
  }
  function lockUI(j, msg){
    wrap.innerHTML = '<div class="lock"><div class="ic">🔒</div><h1>잠긴 보고서예요</h1><p>개인 재무 데이터라 비밀번호로 잠겨 있어요.<br>한 번 풀면 이 기기에서는 다시 묻지 않아요.</p>' +
      '<form id="f"><input type="password" id="p" placeholder="비밀번호" autocomplete="current-password" autofocus><button type="submit">열기</button></form><div class="err" id="err">' + (msg || '') + '</div>' +
      '<div class="hint">비밀번호는 저장되지 않고, 복호화 키만 이 기기의 브라우저에 남아요.<br>상단 🔒 버튼으로 언제든 다시 잠글 수 있어요.</div></div>';
    document.getElementById('f').onsubmit = async function(ev){
      ev.preventDefault();
      var pass = document.getElementById('p').value; var err = document.getElementById('err');
      if (!pass) return;
      err.textContent = '확인 중…';
      try { var key = await deriveKey(pass, j.salt, j.iter || 300000); var html = await decryptWith(key, j); await saveKey(key, j.salt); show(html); }
      catch(e){ err.textContent = '비밀번호가 맞지 않아요'; }
    };
  }
  document.getElementById('lockbtn').onclick = function(){
    try { Object.keys(localStorage).filter(function(k){ return k.indexOf(KEYPFX) === 0; }).forEach(function(k){ localStorage.removeItem(k); }); } catch(e){}
    location.reload();
  };
  (async function(){
    if (!id) { wrap.innerHTML = '<div class="spin">보고서 id가 없어요</div>'; return; }
    if (!window.crypto || !crypto.subtle) { wrap.innerHTML = '<div class="spin">이 브라우저는 복호화를 지원하지 않아요 (https 필요)</div>'; return; }
    var j;
    try { var r = await fetch('monthly/' + id + '.enc.json', { cache: 'no-cache' }); if (!r.ok) throw new Error(r.status); j = await r.json(); }
    catch(e){ wrap.innerHTML = '<div class="spin">보고서를 찾을 수 없어요 (' + id + ')</div>'; return; }
    var key = await loadKey(j.salt);
    if (key) { try { show(await decryptWith(key, j)); return; } catch(e){ /* 키가 바뀐 경우 → 다시 묻기 */ } }
    lockUI(j, '');
  })();
})();
</script>
</body>
</html>
