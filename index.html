<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>실적브리핑 아카이브</title>
<style>
:root{
  --bg:#0d1117; --card:#161b22; --card2:#1c2330; --border:#2d333b;
  --text:#e6edf3; --muted:#8b949e; --accent:#4da3ff; --accent2:#a371f7; --pos:#3fb950; --neg:#f85149; --warn:#d29922;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:'Apple SD Gothic Neo','Pretendard','Noto Sans KR',-apple-system,sans-serif;line-height:1.6;padding:28px 16px 60px}
.wrap{max-width:960px;margin:0 auto}
header{margin-bottom:22px}
h1{font-size:24px}
h1 .accent{color:var(--accent)}
.sub{color:var(--muted);font-size:13.5px;margin-top:4px}
.stats{display:flex;gap:12px;margin:16px 0 22px;flex-wrap:wrap}
.stat{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:10px 18px}
.stat .n{font-size:20px;font-weight:800;color:var(--accent)}
.stat .l{font-size:12px;color:var(--muted)}
h2{font-size:15px;color:var(--muted);font-weight:700;margin:22px 0 10px;text-transform:uppercase;letter-spacing:.05em}
.upcoming{display:flex;gap:8px;flex-wrap:wrap}
.up-chip{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:6px 14px;font-size:12.5px;white-space:nowrap}
.up-chip b{color:var(--accent)}
.up-chip .d{color:var(--muted);margin-left:6px}
.up-chip.soon{border-color:var(--warn)}
.up-chip.soon .d{color:var(--warn);font-weight:700}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.f-chip{background:var(--card);border:1px solid var(--border);color:var(--muted);border-radius:20px;padding:5px 14px;font-size:13px;cursor:pointer;user-select:none}
.f-chip.active{background:rgba(77,163,255,.15);border-color:var(--accent);color:var(--accent);font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px;display:block;color:inherit;text-decoration:none;transition:border-color .15s, transform .15s}
.card:hover{border-color:var(--accent);transform:translateY(-2px)}
.card .top{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.tick{font-size:17px;font-weight:800;color:var(--accent)}
.q{font-size:12.5px;color:var(--muted)}
.badge{margin-left:auto;padding:2px 10px;border-radius:20px;font-size:11px;font-weight:800}
.badge.BEAT{background:rgba(63,185,80,.15);color:var(--pos);border:1px solid var(--pos)}
.badge.MISS{background:rgba(248,81,73,.15);color:var(--neg);border:1px solid var(--neg)}
.badge.MIXED{background:rgba(210,153,34,.15);color:var(--warn);border:1px solid var(--warn)}
.one{font-size:13.5px;margin-bottom:12px;min-height:40px}
.meta{font-size:11.5px;color:var(--muted);display:flex;justify-content:space-between}
.empty{color:var(--muted);font-size:14px;padding:30px;text-align:center;background:var(--card);border:1px dashed var(--border);border-radius:14px}
footer{text-align:center;font-size:11.5px;color:var(--muted);margin-top:36px;padding-top:14px;border-top:1px solid var(--border)}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>📊 실적브리핑 <span class="accent">아카이브</span></h1>
  <div class="sub">보유 종목 13개 분기 실적 보고서 모음 · earnings-briefing 스킬이 자동 갱신 · 최종 갱신: <span id="last-updated"></span></div>
</header>

<div class="stats" id="stats"></div>

<h2>⏭️ 다음 실적발표 예정</h2>
<div class="upcoming" id="upcoming"></div>

<h2>📁 보고서</h2>
<div class="filters" id="filters"></div>
<div class="grid" id="grid"></div>
<div class="empty" id="empty" style="display:none">해당 조건의 보고서가 아직 없어요.</div>

<footer>본 아카이브의 보고서는 정보 제공 목적이며 투자 권유가 아닙니다. · 생성: earnings-briefing 스킬</footer>
</div>

<script>
// ===== 스킬이 갱신하는 데이터 블록 (새 항목은 배열 맨 앞에 추가) =====
const LAST_UPDATED = "2026.08.08";

const REPORTS_DB = [
  {
    ticker: "PLTR", company: "Palantir", quarter: "2026 Q2",
    report_date: "2026-08-04", created: "2026.08.08", verdict: "BEAT",
    oneliner: "\"AI 주권\" 수요로 매출 +93% 재가속, 가이던스 대폭 상향 — 밸류에이션 부담은 재부각",
    file: "실적브리핑_PLTR_2026Q2_2026.08.08.html"
  }
];

// 다음 발표 예정 (state.json 기준, estimated=true는 ⚠️)
const UPCOMING_DB = [
  { ticker: "CRWV", date: "2026-08-12", estimated: false },
  { ticker: "NVDA", date: "2026-08-27", estimated: false },
  { ticker: "MU",   date: "2026-09-30", estimated: true },
  { ticker: "KO",   date: "2026-10-21", estimated: true },
  { ticker: "SK하이닉스", date: "2026-10-28", estimated: true },
  { ticker: "MSFT", date: "2026-10-29", estimated: true },
  { ticker: "GOOGL", date: "2026-10-29", estimated: true },
  { ticker: "AAPL", date: "2026-10-30", estimated: true },
  { ticker: "ABBV", date: "2026-10-31", estimated: true },
  { ticker: "PLTR", date: "2026-11-04", estimated: true },
  { ticker: "O",    date: null, estimated: true },
  { ticker: "IONQ", date: null, estimated: true },
  { ticker: "SMR",  date: null, estimated: true }
];
// ===== 데이터 블록 끝 =====

document.getElementById('last-updated').textContent = LAST_UPDATED;

// 통계
const tickerSet = new Set(REPORTS_DB.map(r => r.ticker));
document.getElementById('stats').innerHTML =
  `<div class="stat"><div class="n">${REPORTS_DB.length}</div><div class="l">보고서</div></div>
   <div class="stat"><div class="n">${tickerSet.size}</div><div class="l">커버 종목</div></div>
   <div class="stat"><div class="n">13</div><div class="l">모니터링 종목</div></div>`;

// 다음 발표 예정 (날짜순, 14일 이내는 강조)
const today = new Date();
const upEl = document.getElementById('upcoming');
UPCOMING_DB
  .slice()
  .sort((a,b) => (a.date||'9999') < (b.date||'9999') ? -1 : 1)
  .forEach(u => {
    const chip = document.createElement('span');
    let soon = false, dtxt = '확인중';
    if (u.date) {
      const d = new Date(u.date + 'T09:00:00+09:00');
      const days = Math.ceil((d - today) / 86400000);
      soon = days >= 0 && days <= 14;
      dtxt = u.date.slice(5).replace('-','/') + (u.estimated ? ' ⚠️' : '') + (soon ? ` (D-${days})` : '');
    }
    chip.className = 'up-chip' + (soon ? ' soon' : '');
    chip.innerHTML = `<b>${u.ticker}</b><span class="d">${dtxt}</span>`;
    upEl.appendChild(chip);
  });

// 필터 + 카드 렌더
let activeFilter = '전체';
function renderFilters(){
  const el = document.getElementById('filters');
  el.innerHTML = '';
  ['전체', ...Array.from(new Set(REPORTS_DB.map(r => r.ticker)))].forEach(t => {
    const c = document.createElement('span');
    c.className = 'f-chip' + (t === activeFilter ? ' active' : '');
    c.textContent = t;
    c.onclick = () => { activeFilter = t; renderFilters(); renderGrid(); };
    el.appendChild(c);
  });
}
function renderGrid(){
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  const rows = REPORTS_DB.filter(r => activeFilter === '전체' || r.ticker === activeFilter);
  document.getElementById('empty').style.display = rows.length ? 'none' : 'block';
  rows.forEach(r => {
    const a = document.createElement('a');
    a.className = 'card';
    a.href = encodeURI(r.file);
    a.innerHTML =
      `<div class="top"><span class="tick">${r.ticker}</span><span class="q">${r.company} · ${r.quarter}</span><span class="badge ${r.verdict}">${r.verdict}</span></div>
       <div class="one">${r.oneliner}</div>
       <div class="meta"><span>발표 ${r.report_date}</span><span>작성 ${r.created}</span></div>`;
    grid.appendChild(a);
  });
}
renderFilters(); renderGrid();
</script>
</body>
</html>
